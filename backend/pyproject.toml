[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediavault"
version = "1.0.0"
description = "Secure Steganographic Archive & Secret Storage in Image/Video Carriers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MediaVault Engineering Team" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
    "pillow>=10.4.0",
    "numpy>=2.0.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "click>=8.1.7",
]

[project.scripts]
mediavault = "backend.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "app"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
